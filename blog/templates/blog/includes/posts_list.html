{% load blog_tags %}

{% if posts %}
    {% for post in posts %}
        {% if post.slug == post_slug %}
            <span>{{ post }}</span>
        {% else %}
            <a href="{{ post.get_post_url }}">{{ post }}</a>
        {% endif %}
        {% if not forloop.last %}
            <span> | </span>
        {% endif %}
    {% endfor %}
{% endif %}
